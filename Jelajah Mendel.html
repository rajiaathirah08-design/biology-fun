<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Jelajah Mendel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: satu kolom. Pelacak tahap menempel di atas, tiap tahap berisi kartu bagian.
   Warna alel dipakai konsisten: kapital = dominan (jingga), kecil = resesif (biru). */
:root{
  --bg:#F2F5F7; --surface:#FFFFFF; --surface2:#E8EEF2; --fg:#16222C; --muted:#52616E; --line:#D2DBE2;
  --accent:#0B7A75; --accent-fg:#FFFFFF; --accent-soft:#D8F0EE;
  --dom:#B45309; --rec:#2458D6;
  --good:#157F3C; --good-soft:#DDF3E4; --bad:#B42318; --bad-soft:#FBE4E1; --warn-soft:#FFF1D6;
  --ph1:#D6EFEC; --ph2:#FBE3CC; --ph3:#DCE5FB; --ph4:#EADCF5;
  --font-head:'Space Grotesk',system-ui,sans-serif; --font-body:'Inter',system-ui,sans-serif; --font-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E161C; --surface:#16212A; --surface2:#1F2C37; --fg:#E7EEF3; --muted:#9AAAB7; --line:#2C3B48;
  --accent:#3CC3BB; --accent-fg:#06201F; --accent-soft:#12383A;
  --dom:#F5A25D; --rec:#7CA6FF;
  --good:#4CC57B; --good-soft:#123422; --bad:#FF8A7D; --bad-soft:#40201C; --warn-soft:#3A2D12;
  --ph1:#143B3A; --ph2:#43291A; --ph3:#1C2B50; --ph4:#32224A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E161C; --surface:#16212A; --surface2:#1F2C37; --fg:#E7EEF3; --muted:#9AAAB7; --line:#2C3B48;
  --accent:#3CC3BB; --accent-fg:#06201F; --accent-soft:#12383A;
  --dom:#F5A25D; --rec:#7CA6FF;
  --good:#4CC57B; --good-soft:#123422; --bad:#FF8A7D; --bad-soft:#40201C; --warn-soft:#3A2D12;
  --ph1:#143B3A; --ph2:#43291A; --ph3:#1C2B50; --ph4:#32224A; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.55 var(--font-body);padding-block:0 56px;overflow-wrap:break-word}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3{font-family:var(--font-head);line-height:1.2;margin:0;text-wrap:balance}
h2{font-size:24px} h3{font-size:18px}
p{margin:0}
b{font-weight:600}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.d{color:var(--dom);font-weight:700}.r{color:var(--rec);font-weight:700}
.mono{font-family:var(--font-mono)}
.small{font-size:14px;color:var(--muted)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{padding-block:10px 0}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{flex:none;width:30px;height:30px}
.brand h1{font-size:19px}
.brand p{font-size:13px;color:var(--muted)}
.stages{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:10px}
.stage{display:flex;align-items:center;gap:8px;min-width:0;padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;font-size:13px;font-weight:500;text-align:left}
.stage .n{flex:none;display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--surface2);font:600 12px var(--font-mono)}
.stage .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stage[aria-current="step"]{border-color:var(--accent);background:var(--accent-soft)}
.stage[aria-current="step"] .n{background:var(--accent);color:var(--accent-fg)}
.stage.ok .n{background:var(--good);color:#fff}
.bar{height:4px;background:var(--surface2);margin-top:10px}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .4s}
@media (max-width:480px){.stage{flex-direction:column;gap:3px;padding:6px 4px;text-align:center;font-size:12px}.stage .t{max-width:100%}.brand p{display:none}}

main{display:flex;flex-direction:column;gap:16px;padding-block:20px 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.intro{background:var(--accent-soft);border-color:transparent}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.note{font-size:14px;color:var(--muted);background:var(--surface2);border-radius:8px;padding:8px 12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:8px 16px;border:1.5px solid var(--accent);border-radius:10px;background:var(--accent);color:var(--accent-fg);font-weight:600;font-size:15px;cursor:pointer}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.sm{min-height:36px;padding:4px 12px;font-size:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cta{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;margin-top:4px}

/* glosarium */
.terms{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px;align-items:start}
details.term{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0}
details.term summary{cursor:pointer;padding:10px 12px;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:8px}
details.term summary::after{content:"+";font-family:var(--font-mono);color:var(--accent)}
details.term[open] summary::after{content:"−"}
details.term[open]{background:var(--accent-soft);border-color:transparent}
details.term div{padding:0 12px 12px;font-size:15px;display:flex;flex-direction:column;gap:6px}
details.term .ex{color:var(--muted);font-size:14px}

/* chip dan penjelajah */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:6px 14px;border:1.5px solid var(--line);border-radius:999px;background:var(--surface);cursor:pointer;font-size:15px;font-weight:500}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.chip.geno-chip{font-family:var(--font-mono);font-size:16px;border-radius:10px}
.lab{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.explout{display:flex;flex-wrap:wrap;gap:16px;align-items:center;background:var(--surface2);border-radius:12px;padding:14px}
.geno-big{font:600 40px var(--font-mono);letter-spacing:.04em}
.explout ul{margin:0;padding-left:18px;flex:1 1 220px}

/* alel dan gamet */
.alleles{display:flex;flex-wrap:wrap;gap:10px}
.allele{display:flex;align-items:center;gap:12px;flex:1 1 200px;border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.big{font:600 34px var(--font-mono)}
.parents{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.parent{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px}
.parent .geno-big{font-size:30px}
.gams{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.gam{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface2);font:600 18px var(--font-mono)}
.gam.w{width:auto;min-width:52px;padding:0 10px;border-radius:22px}
.cmp{width:100%;border-collapse:collapse;font-size:14px}
.cmp th,.cmp td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
.cmp th{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.tblw{overflow-x:auto}

/* langkah */
.walk{display:flex;flex-direction:column;gap:14px}
.step{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px;scroll-margin-top:110px;background:var(--surface)}
.step-h{display:flex;gap:10px;align-items:center}
.step-n{flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--accent);color:var(--accent-fg);font:600 14px var(--font-mono)}
.step-h h3{font-size:17px}
.step-b{display:flex;flex-direction:column;gap:12px;min-width:0}
.step-f{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.gate{font-size:13px;color:var(--muted)}
.fin{background:var(--good-soft);color:var(--fg);border-radius:10px;padding:10px 14px;font-weight:500}

/* kotak Punnett */
.pal{display:flex;flex-wrap:wrap;gap:8px}
.pgrid{display:grid;gap:6px;align-items:stretch}
.pcorner{display:grid;place-items:center;font-size:11px;color:var(--muted);font-family:var(--font-mono);text-align:center;padding:2px}
.phead{display:grid;place-items:center;min-height:38px;padding:0 6px;font:600 16px var(--font-mono);background:var(--surface2);border-radius:8px}
.cell{display:grid;place-items:center;min-height:52px;min-width:0;padding:2px;border:1.5px dashed var(--line);border-radius:8px;background:var(--surface);font:600 clamp(13px,3.6vw,18px) var(--font-mono);cursor:pointer}
.cell:empty::before{content:"?";color:var(--muted)}
.cell.f{border-style:solid}
.cell.ok{border:2px solid var(--good)}
.cell.no{border:2px solid var(--bad);background:var(--bad-soft)}
.cell.hl{outline:3px solid var(--accent);outline-offset:1px}
.cell.ph1{background:var(--ph1);border-style:solid;border-color:transparent}
.cell.ph2{background:var(--ph2);border-style:solid;border-color:transparent}
.cell.ph3{background:var(--ph3);border-style:solid;border-color:transparent}
.cell.ph4{background:var(--ph4);border-style:solid;border-color:transparent}
.cell:disabled{cursor:default}
.statl{font-size:14px;min-height:21px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:14px;height:14px;border-radius:4px;border:1px solid var(--line);vertical-align:-2px;margin-right:6px}
.legend .sw{margin:0}
.sw.ph1{background:var(--ph1)}.sw.ph2{background:var(--ph2)}.sw.ph3{background:var(--ph3)}.sw.ph4{background:var(--ph4)}
.fork{display:grid;grid-template-columns:auto auto auto;column-gap:14px;row-gap:6px;align-items:center;justify-content:start}
.fk{display:grid;place-items:center;min-width:46px;min-height:38px;padding:0 10px;border-radius:8px;font:600 18px var(--font-mono);background:var(--surface2)}
.fk.span{align-self:stretch}
.fk.out{background:var(--accent-soft);border:1.5px solid var(--accent)}
.fkh{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.ratio{display:flex;flex-direction:column;gap:8px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;white-space:nowrap}
.tbl th{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.tbl td:first-child{white-space:normal}
.cnt{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.cnt label{display:flex;align-items:center;gap:8px;font-size:14px}
.cnt input{width:64px;min-height:38px;padding:4px 8px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);font:600 16px var(--font-mono);text-align:center}
.cnt input.ok{border-color:var(--good)}.cnt input.no{border-color:var(--bad);background:var(--bad-soft)}

/* simulator */
.ctl{display:flex;flex-direction:column;gap:6px}
.ctlrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
input[type=range]{width:100%;accent-color:var(--accent);min-height:32px}
.simout{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:12px}

/* soal */
.qlist{display:flex;flex-direction:column;gap:12px}
.q{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.q-prompt{font-weight:500}
.pill{align-self:flex-start;font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px}
.lv1{background:var(--good-soft);color:var(--good)}.lv2{background:var(--warn-soft);color:var(--dom)}.lv3{background:var(--bad-soft);color:var(--bad)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.opt{display:flex;gap:10px;align-items:center;text-align:left;min-height:46px;padding:8px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer}
.opt .lt{flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:6px;background:var(--surface2);font:600 12px var(--font-mono)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.numrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.numrow input{width:120px;min-height:44px;padding:6px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);font:600 18px var(--font-mono)}
.unit{font-weight:500}
.q-tools{display:flex;gap:8px;flex-wrap:wrap}
.hintbox{background:var(--warn-soft);border-radius:10px;padding:10px 14px;font-size:15px;display:flex;flex-direction:column;gap:6px}
.fb{border-radius:10px;padding:10px 14px;font-size:15px;display:flex;flex-direction:column;gap:4px}
.fb.good{background:var(--good-soft)}.fb.bad{background:var(--bad-soft)}
.fb .h{font-weight:700}.fb.good .h{color:var(--good)}.fb.bad .h{color:var(--bad)}
.score{font-weight:600}

/* evaluasi */
.prog{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}
.big-score{font:700 56px var(--font-head);line-height:1}
.tagrow{display:grid;grid-template-columns:minmax(0,150px) 1fr auto;gap:10px;align-items:center;font-size:14px}
.tagrow .prog{height:10px}
.rev{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px;font-size:15px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<header class="top"><div class="wrap">
  <div class="brand">
    <svg viewBox="0 0 30 30" aria-hidden="true"><path d="M8 3c14 8 0 16 14 24M22 3C8 11 22 19 8 27" fill="none" stroke="var(--dom)" stroke-width="2.4" stroke-linecap="round"/><path d="M11 8h8M10 15h10M11 22h8" stroke="var(--rec)" stroke-width="2" stroke-linecap="round"/></svg>
    <div><h1>Jelajah Mendel</h1><p>Pewarisan sifat pada manusia</p></div>
  </div>
  <nav id="stages" class="stages" aria-label="Tahap belajar"></nav>
  <div class="bar" id="bar" role="progressbar" aria-label="Kemajuan belajar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="barfill"></i></div>
</div></header>
<main class="wrap" id="app"></main>

<script>
(function(){
'use strict';
var RM = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
function h(tag, cls, html){ var e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; if(tag==='button') e.type='button'; return e; }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function g(s){ return String(s).split('').map(function(c){ var up=c===c.toUpperCase()&&c!==c.toLowerCase(); return '<span class="'+(up?'d':'r')+'">'+c+'</span>'; }).join(''); }
function fmt(x){ return String(+x.toFixed(2)).replace('.',','); }
function shuffle(a){ var b=a.slice(); for(var i=b.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=b[i]; b[i]=b[j]; b[j]=t; } return b; }
function gcd(a,b){ return b?gcd(b,a%b):a; }
function simp(arr){ var d=arr.reduce(gcd,0); return arr.map(function(x){return x/d;}); }
var uid=0;

/* ---------- logika genetika ---------- */
function normCross(a,b){
  var out='';
  for(var i=0;i<a.length;i++){
    var p=[a[i],b[i]].sort(function(x,y){ return (x===x.toUpperCase()?0:1)-(y===y.toUpperCase()?0:1); });
    out+=p.join('');
  }
  return out;
}
function gametes(gen){
  var pairs=gen.match(/../g), res=[''];
  pairs.forEach(function(p){ var nx=[]; res.forEach(function(r){ nx.push(r+p[0]); nx.push(r+p[1]); }); res=nx; });
  return res;
}
var TRAITS={
  albinisme:{name:'Albinisme',l:'A',dom:'Pigmentasi normal',rec:'Albinisme',carrier:true,
    note:'Albinisme okulokutan diwariskan secara autosomal resesif. Individu dengan albinisme bergenotipe aa.'},
  polidaktili:{name:'Polidaktili',l:'P',dom:'Polidaktili (jari berlebih)',rec:'Jumlah jari normal',carrier:false,
    note:'Polidaktili umumnya diwariskan secara autosomal dominan. Di sini disederhanakan: ekspresinya di dunia nyata bisa bervariasi.'},
  ptc:{name:'Mengecap PTC',l:'T',dom:'Dapat mengecap PTC',rec:'Tidak dapat mengecap PTC',carrier:false,
    note:'Kemampuan mengecap rasa pahit PTC sering dipakai sebagai model satu gen dengan T dominan. Kenyataannya dipengaruhi lebih dari satu faktor.'}
};
function monoDef(t){
  var L=t.l, l=L.toLowerCase();
  var d={ genoOrder:[L+L,L+l,l+l],
    phenos:[{key:'dom',label:t.dom,cls:'ph1'},{key:'rec',label:t.rec,cls:'ph4'}],
    phenoOf:function(x){ return x.indexOf(L)>=0?'dom':'rec'; } };
  d.cls=function(x){ return d.phenos.filter(function(p){return p.key===d.phenoOf(x);})[0].cls; };
  return d;
}
var DI={
  genoOrder:['PPAA','PPAa','PpAA','PpAa','PPaa','Ppaa','ppAA','ppAa','ppaa'],
  phenos:[{key:'P_A_',label:'Polidaktili, pigmen normal',cls:'ph1'},{key:'P_aa',label:'Polidaktili, albino',cls:'ph2'},
          {key:'ppA_',label:'Jari normal, pigmen normal',cls:'ph3'},{key:'ppaa',label:'Jari normal, albino',cls:'ph4'}],
  phenoOf:function(x){ return (x.indexOf('P')>=0?'P_':'pp')+(x.indexOf('A')>=0?'A_':'aa'); }
};
DI.cls=function(x){ return DI.phenos.filter(function(p){return p.key===DI.phenoOf(x);})[0].cls; };

function summaryHTML(cells,def,n){
  var T=cells.length, gc={}, pc={};
  cells.forEach(function(c){ gc[c]=(gc[c]||0)+1; var k=def.phenoOf(c); pc[k]=(pc[k]||0)+1; });
  var gK=def.genoOrder.filter(function(k){return gc[k];}), pK=def.phenos.filter(function(p){return pc[p.key];});
  var gs=simp(gK.map(function(k){return gc[k];})), ps=simp(pK.map(function(p){return pc[p.key];}));
  function row(label,cnt){ return '<td>'+label+'</td><td>'+cnt+'/'+T+'</td><td>'+fmt(cnt/T*100)+'%</td>'+(n!=null?'<td>'+fmt(cnt/T*n)+'</td>':''); }
  function head(first){ return '<thead><tr><th>'+first+'</th><th>Kotak</th><th>Peluang</th>'+(n!=null?'<th>Dari '+n+' anak</th>':'')+'</tr></thead>'; }
  return '<div class="ratio">'
   +'<p><b>Rasio genotipe</b> &nbsp;'+gK.map(function(k,i){return gs[i]+' <span class="mono">'+g(k)+'</span>';}).join(' : ')+'</p>'
   +'<div class="tblw"><table class="tbl">'+head('Genotipe')+'<tbody>'+gK.map(function(k){return '<tr>'+row('<span class="mono">'+g(k)+'</span>',gc[k])+'</tr>';}).join('')+'</tbody></table></div>'
   +'<p><b>Rasio fenotipe</b> &nbsp;'+ps.join(' : ')+'</p>'
   +'<div class="tblw"><table class="tbl">'+head('Fenotipe')+'<tbody>'+pK.map(function(p){return '<tr>'+row('<span class="sw '+p.cls+'"></span>'+p.label,pc[p.key])+'</tr>';}).join('')+'</tbody></table></div></div>';
}

function parseNum(s,unit){
  s=String(s).toLowerCase().replace(/\s+/g,'').replace('%','');
  if(unit&&unit!=='%'){ s=s.replace(unit.toLowerCase(),''); }
  if(s.indexOf('/')>0){ var p=s.split('/'); var a=parseFloat(p[0].replace(',','.')), b=parseFloat(p[1].replace(',','.')); if(!b) return NaN; return unit==='%'?a/b*100:a/b; }
  return parseFloat(s.replace(',','.'));
}
function Question(q,o){
  o=o||{}; var exam=o.mode==='exam', id='q'+(++uid);
  var box=h('div','q');
  if(q.level) box.append(h('span','pill lv'+q.lv,q.level));
  box.append(h('p','q-prompt',q.prompt));
  var body=h('div','q-body'); box.append(body);
  var hintBox=h('div','hintbox'); hintBox.hidden=true;
  var fb=h('div','fb'); fb.hidden=true; fb.setAttribute('role','status');
  var tools=h('div','q-tools');
  var tries=0, hl=0, finished=false, chosen=null, hints=q.hints||[];
  var hintBtn=h('button','btn ghost sm','Petunjuk (0/'+hints.length+')');
  var nextBtn=null, finishHook=null;
  if(!exam&&hints.length){
    tools.append(hintBtn);
    hintBtn.onclick=function(){
      if(finished||hl>=hints.length) return;
      hl++; hintBox.hidden=false;
      hintBox.innerHTML=hints.slice(0,hl).map(function(t,i){return '<p><b>Petunjuk '+(i+1)+'.</b> '+t+'</p>';}).join('');
      hintBtn.textContent='Petunjuk ('+hl+'/'+hints.length+')';
      if(hl>=hints.length) hintBtn.disabled=true;
    };
  }
  function miss(){ fb.hidden=false; fb.className='fb bad'; fb.innerHTML='<span class="h">Belum tepat.</span><span>Coba lagi. Petunjuk bisa membantu.</span>'; }
  function finish(correct){
    finished=true; hintBtn.disabled=true;
    fb.hidden=false; fb.className='fb '+(correct?'good':'bad');
    fb.innerHTML='<span class="h">'+(correct?'Tepat!':'Jawaban yang benar sudah ditunjukkan.')+'</span><span>'+q.explain+'</span>';
    if(finishHook) finishHook();
    if(o.onDone) o.onDone({correct:correct,first:correct&&tries===1});
  }
  var opts, els, inp, isOk=function(){ return false; };
  if(q.type==='mcq'){
    opts=q.options.map(function(t,i){return {t:t,ok:i===q.answer};});
    if(o.shuffle) opts=shuffle(opts);
    var list=h('div','opts'); body.append(list);
    els=opts.map(function(op,i){
      var b=h('button','opt','<span class="lt">'+'ABCD'.charAt(i)+'</span><span>'+op.t+'</span>');
      b.onclick=function(){
        if(finished) return;
        if(exam){ chosen=i; els.forEach(function(e,k){e.classList.toggle('sel',k===i);}); nextBtn.disabled=false; return; }
        tries++;
        if(op.ok){ b.classList.add('ok'); lockAll(); finish(true); }
        else{
          b.classList.add('no'); b.disabled=true;
          if(tries>=2){ els.forEach(function(e,k){ if(opts[k].ok) e.classList.add('ok'); }); lockAll(); finish(false); } else miss();
        }
      };
      list.append(b); return b;
    });
  } else {
    var row=h('div','numrow'); inp=h('input'); inp.id=id+'-in'; inp.type='text'; inp.setAttribute('inputmode','decimal'); inp.autocomplete='off';
    inp.setAttribute('aria-label','Jawabanmu');
    row.append(inp);
    if(q.unit) row.append(h('span','unit',esc(q.unit)));
    var tol=q.unit==='%'?0.06:0.001;
    isOk=function(){ var v=parseNum(inp.value,q.unit); return !isNaN(v)&&Math.abs(v-q.answer)<=tol; };
    if(exam){ inp.oninput=function(){ nextBtn.disabled=!inp.value.trim(); }; }
    else{
      var cb=h('button','btn sm','Periksa'); row.append(cb);
      var run=function(){
        if(finished||!inp.value.trim()) return;
        tries++;
        if(isOk()){ inp.classList.add('ok'); inp.disabled=true; cb.disabled=true; finish(true); }
        else if(tries>=2){ inp.disabled=true; cb.disabled=true; finish(false); }
        else miss();
      };
      cb.onclick=run; inp.onkeydown=function(e){ if(e.key==='Enter') run(); };
    }
    body.append(row);
  }
  function lockAll(){ els.forEach(function(e){ e.disabled=true; }); }
  box.append(tools,hintBox,fb);
  if(exam){
    nextBtn=h('button','btn',o.nextLabel||'Lanjut'); nextBtn.disabled=true;
    nextBtn.onclick=function(){
      var ok, given;
      if(q.type==='mcq'){ ok=opts[chosen].ok; given=opts[chosen].t; } else { ok=isOk(); given=esc(inp.value.trim()+(q.unit?' '+q.unit:'')); }
      if(o.onDone) o.onDone({correct:ok,given:given});
    };
    box.append(nextBtn);
  }
  return box;
}

function Walk(steps,onFinish){
  var root=h('div','walk');
  function show(i){
    var s=steps[i], blk=h('section','step');
    blk.innerHTML='<div class="step-h"><span class="step-n">'+(i+1)+'</span><h3>'+s.title+'</h3></div>';
    var body=h('div','step-b'), foot=h('div','step-f');
    blk.append(body,foot); root.append(blk);
    var last=i===steps.length-1, btn=h('button','btn',last?'Selesai':'Lanjut'), note=h('span','gate','Selesaikan bagian di atas dulu.');
    btn.disabled=true; foot.append(btn,note);
    var ready=false;
    function complete(){ if(ready) return; ready=true; btn.disabled=false; note.hidden=true; }
    btn.onclick=function(){
      foot.remove();
      if(last){ root.append(h('div','fin','Semua langkah selesai. Lanjut ke bagian berikutnya.')); if(onFinish) onFinish(); }
      else{ show(i+1); }
    };
    s.render(body,complete);
    if(!s.gate) complete();
    if(i>0) blk.scrollIntoView({behavior:RM?'auto':'smooth',block:'start'});
  }
  show(0);
  return root;
}

/* ---------- komponen: kotak Punnett isian ---------- */
function Punnett(cfg){
  var rowG=cfg.rowG, colG=cfg.colG, def=cfg.def, R=rowG.length, C=colG.length;
  var truth=rowG.map(function(r){return colG.map(function(c){return normCross(r,c);});});
  var val=rowG.map(function(){return colG.map(function(){return '';});});
  var sel=null, solved=false, hlCell=null, cells=[];
  var root=h('div','pn card-in'); root.style.display='flex'; root.style.flexDirection='column'; root.style.gap='10px';
  root.append(h('p','small','Pilih genotipe, lalu ketuk kotak yang sesuai. Gabungkan alel baris dengan alel kolom.'));
  var pal=h('div','pal'); root.append(pal);
  cfg.palette.forEach(function(p){
    var b=h('button','chip geno-chip',g(p)); b.dataset.v=p; b.setAttribute('aria-pressed','false');
    b.onclick=function(){ if(solved) return; sel=(sel===p?null:p); Array.prototype.forEach.call(pal.children,function(x){ x.setAttribute('aria-pressed',String(x.dataset.v===sel)); }); };
    pal.append(b);
  });
  var grid=h('div','pgrid'); grid.style.gridTemplateColumns='auto repeat('+C+',minmax(0,1fr))';
  grid.append(h('div','pcorner','♀ ↓<br>♂ →'));
  colG.forEach(function(c){ grid.append(h('div','phead',g(c))); });
  rowG.forEach(function(r,i){
    grid.append(h('div','phead',g(r))); cells[i]=[];
    colG.forEach(function(c,j){
      var b=h('button','cell'); b.setAttribute('aria-label','Kotak baris '+(i+1)+', kolom '+(j+1));
      b.onclick=function(){ place(i,j); }; cells[i][j]=b; grid.append(b);
    });
  });
  root.append(grid);
  var st=h('p','statl'); st.setAttribute('role','status'); root.append(st);
  var legend=h('div'); legend.innerHTML=legendHTML(def); legend.hidden=true; root.append(legend);
  var tools=h('div','row'), cB=h('button','btn sm','Periksa jawaban'), hB=h('button','btn ghost sm','Petunjuk'), rB=h('button','btn ghost sm','Tampilkan jawaban');
  rB.hidden=true; tools.append(cB,hB,rB); root.append(tools);
  function draw(i,j){ var b=cells[i][j]; b.innerHTML=val[i][j]?g(val[i][j]):''; b.classList.toggle('f',!!val[i][j]); b.classList.remove('ok','no','hl'); }
  function place(i,j){
    if(solved) return;
    if(sel){ val[i][j]=sel; draw(i,j); st.textContent=''; }
    else if(val[i][j]){ val[i][j]=''; draw(i,j); }
    else st.textContent='Pilih genotipe dari daftar di atas dulu.';
  }
  function finishP(peek){
    solved=true;
    for(var i=0;i<R;i++) for(var j=0;j<C;j++){ val[i][j]=truth[i][j]; draw(i,j); cells[i][j].classList.add(def.cls(truth[i][j])); cells[i][j].disabled=true; }
    st.innerHTML=peek?'Jawaban ditampilkan. Perhatikan polanya, lalu lanjut.':'<b style="color:var(--good)">Semua kotak benar!</b>';
    tools.hidden=true; pal.hidden=true; legend.hidden=false;
    if(cfg.onSolved) cfg.onSolved(peek);
  }
  cB.onclick=function(){
    var right=0, wrong=0, empty=0;
    for(var i=0;i<R;i++) for(var j=0;j<C;j++){
      var c=cells[i][j]; c.classList.remove('ok','no','hl');
      if(!val[i][j]) empty++; else if(val[i][j]===truth[i][j]){ right++; c.classList.add('ok'); } else { wrong++; c.classList.add('no'); }
    }
    if(right===R*C){ finishP(false); return; }
    st.textContent=right+' kotak benar, '+wrong+' salah, '+empty+' kosong.';
    if(wrong>0) rB.hidden=false;
  };
  hB.onclick=function(){
    for(var i=0;i<R;i++) for(var j=0;j<C;j++){
      if(val[i][j]!==truth[i][j]){
        if(hlCell) hlCell.classList.remove('hl');
        hlCell=cells[i][j]; hlCell.classList.add('hl');
        st.innerHTML='Kotak baris '+(i+1)+', kolom '+(j+1)+': gabungkan <span class="mono">'+g(rowG[i])+'</span> (baris) dengan <span class="mono">'+g(colG[j])+'</span> (kolom).';
        return;
      }
    }
  };
  rB.onclick=function(){ finishP(true); };
  return {el:root,truth:truth};
}
function staticGrid(rowG,colG,def){
  var C=colG.length, html='<div class="pgrid" style="grid-template-columns:auto repeat('+C+',minmax(0,1fr))"><div class="pcorner">♀ ↓<br>♂ →</div>';
  colG.forEach(function(c){ html+='<div class="phead">'+g(c)+'</div>'; });
  rowG.forEach(function(r){
    html+='<div class="phead">'+g(r)+'</div>';
    colG.forEach(function(c){ var x=normCross(r,c); html+='<div class="cell f '+def.cls(x)+'" style="cursor:default">'+g(x)+'</div>'; });
  });
  return html+'</div>';
}

function Explorer(){
  var card=h('section','card');
  card.innerHTML='<h3>Penjelajah genotipe</h3><p>Pilih sifat dan genotipe. Lihat fenotipe dan istilahnya.</p>';
  var key='albinisme', gi=1;
  var tc=h('div','chips'), gc=h('div','chips'), out=h('div','explout');
  card.append(h('span','lab','Sifat'),tc,h('span','lab','Genotipe'),gc,out);
  function render(){
    var t=TRAITS[key], L=t.l, l=L.toLowerCase(), gl=[L+L,L+l,l+l];
    tc.innerHTML=''; gc.innerHTML='';
    Object.keys(TRAITS).forEach(function(k){ var b=h('button','chip',TRAITS[k].name); b.setAttribute('aria-pressed',String(k===key)); b.onclick=function(){ key=k; render(); }; tc.append(b); });
    gl.forEach(function(x,i){ var b=h('button','chip geno-chip',g(x)); b.setAttribute('aria-pressed',String(i===gi)); b.onclick=function(){ gi=i; render(); }; gc.append(b); });
    var gt=gl[gi], type=['Homozigot dominan','Heterozigot','Homozigot resesif'][gi];

  }
  render(); return card;
}

function Simulator(){
  var card=h('section','card'); card.innerHTML='<h3>Simulator kotak Punnett</h3><p>Pilih sifat dan genotipe kedua induk. Kotak Punnett, rasio, dan perkiraan jumlah anak terisi otomatis.</p>';
  var st={t:'albinisme',f:1,m:1,n:8};
  var tc=h('div','chips'), fc=h('div','chips'), mc=h('div','chips'), out=h('div','simout');
  var slider=h('input'); slider.type='range'; slider.min=1; slider.max=12; slider.value=st.n; slider.id='sim-n'; slider.setAttribute('aria-label','Jumlah anak');
  var nlab=h('span','lab','');
  var c1=h('div','ctl'), c2=h('div','ctl'), c3=h('div','ctl'), c4=h('div','ctl');
  c1.append(h('span','lab','Sifat'),tc); c2.append(h('span','lab','Genotipe ayah ♂'),fc); c3.append(h('span','lab','Genotipe ibu ♀'),mc); c4.append(nlab,slider);
  var cr=h('div','ctlrow'); cr.append(c2,c3,c4);
  card.append(c1,cr,out);
  function render(){
    var t=TRAITS[st.t], L=t.l, l=L.toLowerCase(), gl=[L+L,L+l,l+l], D=monoDef(t);
    tc.innerHTML=''; fc.innerHTML=''; mc.innerHTML='';
    Object.keys(TRAITS).forEach(function(k){ var b=h('button','chip',TRAITS[k].name); b.setAttribute('aria-pressed',String(k===st.t)); b.onclick=function(){ st.t=k; render(); }; tc.append(b); });
    [['f',fc],['m',mc]].forEach(function(pair){ gl.forEach(function(x,i){ var b=h('button','chip geno-chip',g(x)); b.setAttribute('aria-pressed',String(i===st[pair[0]])); b.onclick=function(){ st[pair[0]]=i; render(); }; pair[1].append(b); }); });
    nlab.textContent='Jumlah anak: '+st.n;
    var fa=gl[st.f], mo=gl[st.m], cellsArr=[];
    var rowG=gametes(mo), colG=gametes(fa);
    rowG.forEach(function(r){ colG.forEach(function(c){ cellsArr.push(normCross(r,c)); }); });
    out.innerHTML='<p><span class="mono">P: '+g(fa)+' × '+g(mo)+'</span> &nbsp;('+t.name+')</p>'+staticGrid(rowG,colG,D)+legendHTML(D)+summaryHTML(cellsArr,D,st.n)

  }

  render(); return card;
}

      card.append(head);
      var pg=h('div','prog'); pg.innerHTML='<i style="width:'+(idx/qs.length*100)+'%"></i>'; card.append(pg);
      card.append(Question(qs[idx],{mode:'exam',shuffle:true,nextLabel:idx===qs.length-1?'Lihat hasil':'Lanjut',onDone:function(r){
        res.push({q:qs[idx],correct:r.correct,given:r.given}); idx++;
        if(idx<qs.length) showQ(); else result(res);
        card.scrollIntoView({block:'start'});
      }}));
    }
    showQ();
  }
  function result(res){
    mark('x');
    var score=res.filter(function(r){return r.correct;}).length, tags={};
    res.forEach(function(r){ var t=r.q.tag; tags[t]=tags[t]||{n:0,ok:0}; tags[t].n++; if(r.correct) tags[t].ok++; });
    card.innerHTML='';
    var top=h('div','row'); top.style.gap='16px';
    top.innerHTML='<span class="big-score">'+score+'/'+res.length+'</span><span>'+(score===res.length?'Sempurna. Semua konsep sudah kuat.':score>=7?'Bagus. Periksa bagian yang masih lemah di bawah.':'Masih ada konsep yang perlu diulang. Mulai dari bagian terlemah di bawah.')+'</span>';
    card.append(top);
    card.append(h('h3','','Pemahaman per topik'));
    var weak=null, weakPct=2;
    Object.keys(tags).forEach(function(t){
      var x=tags[t], pct=x.ok/x.n; if(pct<weakPct){ weakPct=pct; weak=t; }
      var r=h('div','tagrow','<span>'+t+'</span><div class="prog"><i style="width:'+pct*100+'%"></i></div><b>'+x.ok+'/'+x.n+'</b>'); card.append(r);
    });
    if(weak&&weakPct<1){
      var n=h('div','note','Topik yang paling perlu diulang: <b>'+weak+'</b>. ');
      var a=h('button','btn ghost sm','Buka '+STAGES[TAGS[weak]].label); a.onclick=function(){ location.hash=STAGES[TAGS[weak]].id; };
      n.append(a); card.append(n);
    }
    var wrong=res.filter(function(r){return !r.correct;});
    if(wrong.length){
      card.append(h('h3','','Pembahasan soal yang belum tepat'));
      wrong.forEach(function(r){ card.append(h('div','rev','<p>'+r.q.prompt+'</p><p><b>Jawabanmu:</b> '+r.given+'</p><p><b>Jawaban benar:</b> '+answerKey(r.q)+'</p><p class="small">'+r.q.explain+'</p>')); });
    }
    var rb=h('button','btn','Ulangi dengan soal diacak'); rb.onclick=start;
    var cr=h('div','cta'); cr.append(rb); card.append(cr);
  }
  start();
  m.append(ctaRow(2,null));
}

/* ---------- router ---------- */
var BUILD=[stageKonsep,stageMono,stageDi,stageExam];
function route(){
  var id=location.hash.slice(1), i=STAGES.findIndex(function(s){return s.id===id;});
  cur=i<0?0:i;
  app.innerHTML=''; BUILD[cur](app); updateNav();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
route();
})();
</script>
